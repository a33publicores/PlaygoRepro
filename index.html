<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayBar Go - Reproductor</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#video {
    width: 100vw;
    height: 100vh;
    background: #000;
}

#estado {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="estado">Cargando...</div>

<video
    id="video"
    controls
    autoplay
    playsinline>
</video>

<script>
const API_URL = "https://playbargo-player-jukebox-repro-propio.up.railway.app";
const CLIENTE = "A33";

const video = document.getElementById("video");
const estado = document.getElementById("estado");

let videoActual = "";

async function cargarEstado() {
    try {
        const response = await fetch(
            API_URL + "/player/status?cliente=" + CLIENTE
        );

        const data = await response.json();

        if (!data.ok) {
            estado.textContent = data.mensaje || "Esperando canciones...";
            return;
        }

        if (!data.actual || !data.actual.video_url) {
            estado.textContent = "No hay video disponible";
            return;
        }

        const actual = data.actual;
        const id = actual.videoId || "";

        if (id !== videoActual) {
            videoActual = id;

            estado.textContent =
                actual.titulo || "Reproduciendo...";

// Reinicia completamente el reproductor
video.pause();
video.removeAttribute("src");
video.load();

// Asigna la nueva URL
video.src = actual.video_url;

// Configuración de audio
video.controls = true;
video.muted = false;
video.defaultMuted = false;
video.volume = 1.0;

// Recarga el recurso
video.load();

// Primero inicia silenciado para que el autoplay sea permitido
video.muted = true;

try {
    const playPromise = video.play();

    if (playPromise !== undefined) {
        await playPromise;
    }

    // Forzar nuevamente el audio después del play
    setTimeout(() => {
        video.muted = false;
        video.defaultMuted = false;
        video.volume = 1.0;
    }, 1000);

} catch (err) {
    console.log("Autoplay bloqueado:", err);
}
        }
    } catch (err) {
        console.error(err);
        estado.textContent = "Error de conexión";
    }
}

video.addEventListener("ended", async function () {
    estado.textContent = "Cargando siguiente canción...";
    videoActual = "";   // Fuerza a detectar un nuevo video

    try {
        // Notifica al backend que debe avanzar
        await fetch(
            API_URL + "/player/next?cliente=" + CLIENTE,
            {
                method: "POST"
            }
        );
    } catch (err) {
        console.error("Error avanzando:", err);
    }

    // Espera 3 segundos para que el backend procese
    setTimeout(async function () {
        await cargarEstado();
    }, 3000);
});

    document.addEventListener("click", async function () {
    video.removeAttribute("muted");
    video.muted = false;
    video.defaultMuted = false;
    video.volume = 1.0;

    try {
        await video.play();
    } catch (e) {
        console.log("No se pudo activar el audio:", e);
    }
}, { once: true });

setInterval(cargarEstado, 15000);
cargarEstado();
</script>

</body>
</html>
