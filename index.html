<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayBar Go - Reproductor</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#video {
    width: 100vw;
    height: 100vh;
    background: #000;
}

#estado {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="estado">Cargando...</div>

<video
    id="video"
    controls
    autoplay
    playsinline>
</video>

<script>
const API_URL = "https://playbargo-player-jukebox-repro-propio.up.railway.app";
const CLIENTE = "A33";

const video = document.getElementById("video");
const estado = document.getElementById("estado");

let videoActual = "";

// Cargar canción actual
async function cargarEstado() {
    try {
        const response = await fetch(
            ${API_URL}/player/status?cliente=${CLIENTE}
        );

        const data = await response.json();

        if (!data.ok) {
            estado.textContent = data.mensaje || "Esperando canciones...";
            return;
        }

        if (!data.actual || !data.actual.video_url) {
            estado.textContent = "No hay video disponible";
            return;
        }

        const actual = data.actual;
        const id = actual.videoId || "";

        // Solo cargar si es un video diferente
        if (id !== videoActual) {
            videoActual = id;

            estado.textContent =
                actual.titulo || "Reproduciendo...";

            video.src = actual.video_url;
            video.load();

            // Activar sonido
            video.muted = false;
            video.defaultMuted = false;
            video.volume = 1;

            try {
                await video.play();
            } catch (err) {
                console.log("Autoplay bloqueado:", err);
            }
        }
    } catch (err) {
        console.error(err);
        estado.textContent = "Error de conexión";
    }
}

// Cuando termina el video
video.addEventListener("ended", async () => {
    try {
        await fetch(${API_URL}/player/next, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                cliente: CLIENTE
            })
        });
    } catch (e) {
        console.error("Error al pasar a la siguiente canción:", e);
    }

    // Esperar 2 segundos y cargar la siguiente
    setTimeout(() => {
        video.muted = false;
        video.volume = 1;
        cargarEstado();
    }, 2000);
});

// Revisar cada 5 segundos si hay un nuevo video
setInterval(cargarEstado, 5000);

// Primera carga
cargarEstado();

// Si el navegador bloquea el audio, el primer clic lo activa
document.addEventListener("click", async () => {
    video.muted = false;
    video.volume = 1;

    try {
        await video.play();
    } catch (e) {
        console.log("No se pudo activar audio:", e);
    }
}, { once: true });
</script>

</body>
</html>
