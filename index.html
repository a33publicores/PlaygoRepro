<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayBar Go - Reproductor</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#contenedor {
    display: flex;
    width: 100vw;
    height: 100vh;
    background: #000;
}

#video-container {
    flex: 1;
    position: relative;
    background: #000;
}

#video {
    width: 100%;
    height: 100%;
    background: #000;
}

#playlist {
    width: 380px;
    background: #111;
    color: #fff;
    overflow-y: auto;
    border-left: 1px solid rgba(255,255,255,0.1);
}

#playlist h2 {
    margin: 0;
    padding: 18px 20px;
    font-size: 20px;
    background: #1c1c1c;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.playlist-item {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.playlist-item.actual {
    background: rgba(255, 0, 0, 0.12);
    border-left: 4px solid #ff0000;
}

.playlist-item .titulo {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.35;
}

.playlist-item .estado {
    margin-top: 6px;
    font-size: 12px;
    opacity: 0.7;
}

#estado {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 9999;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}

/* Vista móvil */
@media (max-width: 900px) {
    #contenedor {
        flex-direction: column;
    }

    #playlist {
        width: 100%;
        height: 35vh;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.1);
    }

    #video-container {
        height: 65vh;
    }
}

    .thumb {
    width: 120px;
    height: 68px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.info {
    flex: 1;
    min-width: 0;
}

.estado-item {
    margin-top: 6px;
    font-size: 12px;
    opacity: 0.7;
}
</style>
</head>
<body>

<div id="contenedor">

    <div id="video-container">
        <div id="estado">Cargando...</div>

        <video
            id="video"
            controls
            autoplay
            playsinline>
        </video>
    </div>

    <div id="playlist">
        <h2>🎵 Playlist</h2>
        <div id="playlist-items"></div>
    </div>

</div>

<script>
const API_URL = "https://playbargo-player-jukebox-repro-propio.up.railway.app";
const CLIENTE = "A33";

const video = document.getElementById("video");
const estado = document.getElementById("estado");
const playlistItems = document.getElementById("playlist-items");

let videoActual = "";

async function cargarEstado() {
    try {
        const response = await fetch(
            API_URL + "/player/status?cliente=" + CLIENTE
        );

        const data = await response.json();
        renderPlaylist(data);

        if (!data.ok) {
            estado.textContent = data.mensaje || "Esperando canciones...";
            return;
        }

        if (!data.actual || !data.actual.video_url) {
            estado.textContent = "No hay video disponible";
            return;
        }

        const actual = data.actual;
        const id = actual.videoId || "";

        if (id !== videoActual) {
            videoActual = id;

            estado.textContent =
                actual.titulo || "Reproduciendo...";

// Reiniciar completamente el reproductor
video.pause();
video.removeAttribute("src");
video.load();

// Crear una fuente explícita MP4
video.innerHTML = "";
const source = document.createElement("source");
source.src = actual.video_url;
source.type = "video/mp4";
video.appendChild(source);

// Configuración
video.controls = true;
video.volume = 1.0;
video.muted = false;
video.defaultMuted = false;

// Cargar y reproducir
video.load();

try {
    await video.play();
} catch (err) {
    console.log("Autoplay bloqueado:", err);
}
        }
    } catch (err) {
        console.error(err);
        estado.textContent = "Error de conexión";
    }
}

video.addEventListener("ended", async function () {
    estado.textContent = "Cargando siguiente canción...";
    videoActual = "";   // Fuerza a detectar un nuevo video

    try {
        // Notifica al backend que debe avanzar
        await fetch(
            API_URL + "/player/next?cliente=" + CLIENTE,
            {
                method: "POST"
            }
        );
    } catch (err) {
        console.error("Error avanzando:", err);
    }

    // Espera 3 segundos para que el backend procese
    setTimeout(async function () {
        await cargarEstado();
    }, 3000);
});

    document.addEventListener("click", async function () {
    video.removeAttribute("muted");
    video.muted = false;
    video.defaultMuted = false;
    video.volume = 1.0;

    try {
        await video.play();
    } catch (e) {
        console.log("No se pudo activar el audio:", e);
    }
}, { once: true });

function renderPlaylist(data) {
    if (!data || !data.actual) {
        playlistItems.innerHTML = "";
        return;
    }

    let html = "";

    // Canción actual
    html += `
    <div class="playlist-item actual">
        <img
            src="https://img.youtube.com/vi/${data.actual.videoId}/hqdefault.jpg"
            class="thumb"
        >
        <div class="info">
            <div class="titulo">
                ▶️ ${data.actual.titulo || 'Reproduciendo...'}
            </div>
            <div class="estado-item">En reproducción</div>
        </div>
    </div>
`;

    // Siguiente canción
    if (data.siguiente) {
    html += `
        <div class="playlist-item">
            <img
                src="https://img.youtube.com/vi/${data.siguiente.videoId}/hqdefault.jpg"
                class="thumb"
            >
            <div class="info">
                <div class="titulo">
                    ⏭️ ${data.siguiente.titulo || 'Siguiente'}
                </div>
                <div class="estado-item">En cola</div>
            </div>
        </div>
    `;
}

    playlistItems.innerHTML = html;
}

setInterval(cargarEstado, 15000);
cargarEstado();
</script>

</body>
</html>
