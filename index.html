<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayBar Go - Reproductor</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#contenedor {
    display: flex;
    width: 100vw;
    height: 100vh;
    background: #000;
}

#video-container {
    flex: 1;
    position: relative;
    background: #000;
}

#video {
    width: 100%;
    height: 100%;
    background: #000;
}

#playlist {
    width: 420px;
    background: #111;
    color: #fff;
    overflow-y: auto;
    border-left: 1px solid rgba(255,255,255,0.1);
}

#playlist h2 {
    margin: 0;
    padding: 18px 20px;
    font-size: 20px;
    background: #1c1c1c;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.playlist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.playlist-item.actual {
    background: rgba(255,0,0,0.12);
    border-left: 4px solid #ff0000;
}

.thumb {
    width: 120px;
    height: 68px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.info {
    flex: 1;
    min-width: 0;
}

.titulo {
    font-size: 14px;
    font-weight: bold;
    line-height: 1.35;
}

.estado-item {
    margin-top: 6px;
    font-size: 12px;
    opacity: 0.7;
}

.acciones {
    display: none;
    flex-direction: column;
    gap: 4px;
}

body.modo-dj .acciones {
    display: flex;
}

.acciones button {
    background: #222;
    color: #fff;
    border: none;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
}

.acciones button:hover {
    background: #444;
}

#estado {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 9999;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}

#panel-superior {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
}

#btnDJ {
    background: #111;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
}

#control-volumen {
    display: none;
    background: rgba(0,0,0,0.75);
    padding: 10px;
    border-radius: 10px;
}

body.modo-dj #control-volumen {
    display: block;
}

#control-volumen input {
    width: 140px;
}

@media (max-width: 900px) {
    #contenedor {
        flex-direction: column;
    }

    #video-container {
        height: 65vh;
    }

    #playlist {
        width: 100%;
        height: 35vh;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.1);
    }

    .thumb {
        width: 90px;
        height: 50px;
    }
}
</style>
</head>
<body>

<div id="contenedor">

    <div id="video-container">

        <div id="estado">Cargando...</div>

        <div id="panel-superior">
            <button id="btnDJ" onclick="abrirDJ()">🎛️ DJ</button>
            <div id="control-volumen">
                🔊 <input type="range" min="0" max="1" step="0.01" value="1" oninput="video.volume=this.value">
            </div>
        </div>

        <video
            id="video"
            controls
            autoplay
            playsinline>
        </video>

    </div>

    <div id="playlist">
        <h2>🎵 Playlist</h2>
        <div id="playlist-items"></div>
    </div>

</div>

<script>
const API_URL = "https://playbargo-player-jukebox-repro-propio.up.railway.app";
const CLIENTE = "A33";

const video = document.getElementById("video");
const estado = document.getElementById("estado");
const playlistItems = document.getElementById("playlist-items");

let videoActual = "";
let audioHabilitado = false;

function thumbnail(videoId) {
    return https://img.youtube.com/vi/${videoId}/hqdefault.jpg;
}

async function cargarEstado() {
    try {
        const response = await fetch(
            API_URL + "/player/status?cliente=" + CLIENTE
        );

        const data = await response.json();

        renderPlaylist(data);

        if (!data.ok) {
            estado.textContent = data.mensaje || "Esperando canciones...";
            return;
        }

        if (!data.actual || !data.actual.video_url) {
            estado.textContent = "No hay video disponible";
            return;
        }

        const actual = data.actual;
        const id = actual.videoId || "";

        if (id !== videoActual) {
            videoActual = id;
            estado.textContent = actual.titulo || "Reproduciendo...";

            video.pause();
            video.removeAttribute("src");
            video.load();

            video.src = actual.video_url;
            video.controls = true;
            video.volume = 1;
            video.muted = !audioHabilitado;
            video.load();

            try {
                await video.play();
            } catch (err) {
                console.log("Autoplay bloqueado:", err);
            }
        }
    } catch (err) {
        console.error(err);
        estado.textContent = "Error de conexión";
    }
}

video.addEventListener("ended", async function () {
    estado.textContent = "Cargando siguiente canción...";
    videoActual = "";

    try {
        await fetch(
            API_URL + "/player/next?cliente=" + CLIENTE,
            {
                method: "POST"
            }
        );
    } catch (err) {
        console.error("Error avanzando:", err);
    }

    setTimeout(cargarEstado, 3000);
});

async function habilitarAudio() {
    audioHabilitado = true;
    video.muted = false;
    video.defaultMuted = false;
    video.volume = 1;

    try {
        await video.play();
    } catch (e) {
        console.log("No se pudo activar el audio:", e);
    }
}

window.addEventListener("click", habilitarAudio, { once: true });
window.addEventListener("touchstart", habilitarAudio, { once: true });

function renderPlaylist(data) {
    if (!data || !data.actual) {
        playlistItems.innerHTML = "";
        return;
    }

    let html = "";

    html += `
        <div class="playlist-item actual">
            <img src="${thumbnail(data.actual.videoId)}" class="thumb">
            <div class="info">
                <div class="titulo">▶️ ${data.actual.titulo || 'Reproduciendo...'}</div>
                <div class="estado-item">En reproducción</div>
            </div>
        </div>
    `;

    (data.cola || []).forEach((item, index) => {
        const fila = item.fila || (index + 3);

        html += `
            <div class="playlist-item">
                <img src="${thumbnail(item.videoId)}" class="thumb">
                <div class="info">
                    <div class="titulo">${index + 1}. ${item.titulo}</div>
                    <div class="estado-item">En cola</div>
                </div>
                <div class="acciones">
                    <button onclick="subir(${fila})">⬆️</button>
                    <button onclick="bajar(${fila})">⬇️</button>
                    <button onclick="repetir(${fila})">🔁</button>
                    <button onclick="eliminarCancion(${fila})">🗑️</button>
                </div>
            </div>
        `;
    });

    playlistItems.innerHTML = html;
}

async function eliminarCancion(fila) {
    await llamarAPI("/player/delete", { fila });
}

async function repetir(fila) {
    await llamarAPI("/player/repeat", { fila });
}

async function subir(fila) {
    await llamarAPI("/player/move", {
        origen: fila,
        destino: fila - 1
    });
}

async function bajar(fila) {
    await llamarAPI("/player/move", {
        origen: fila,
        destino: fila + 1
    });
}

async function llamarAPI(endpoint, datos) {
    try {
        const payload = Object.assign({
            cliente: CLIENTE
        }, datos || {});

        await fetch(API_URL + endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });
    } catch (e) {
        console.error(e);
    }

    setTimeout(cargarEstado, 1000);
}

function abrirDJ() {
    const usuario = prompt("Usuario DJ:");
    const clave = prompt("Contraseña:");

    if (usuario === CLIENTE && clave === "1234") {
        document.body.classList.add("modo-dj");
        alert("Modo DJ activado");
    } else {
        alert("Credenciales incorrectas");
    }
}

// Consultar cada 15 segundos
setInterval(cargarEstado, 15000);

// Carga inicial
cargarEstado();
</script>

</body>
</html>
