<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayBar Go Reproductor</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
}

.info {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 999;
    background: rgba(0,0,0,0.7);
    padding: 15px 20px;
    border-radius: 12px;
    max-width: 500px;
}

.actual {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 10px;
}

.siguiente {
    font-size: 18px;
    color: #00d4ff;
}
</style>
</head>
<body>

<div class="info">
    <div class="actual" id="tituloActual">Cargando...</div>
    <div class="siguiente" id="tituloSiguiente"></div>
</div>

<video
    id="video"
    autoplay
    controls
    playsinline
></video>

<script>
const BACKEND =
  "https://playbargo-player-jukebox-repro-propio.up.railway.app";

const CLIENTE = "A33";

const video = document.getElementById("video");
const tituloActual = document.getElementById("tituloActual");
const tituloSiguiente = document.getElementById("tituloSiguiente");

let videoActualId = null;

// Cargar estado desde Railway
async function cargarEstado() {
    try {
        const res = await fetch(
            ${BACKEND}/player/status?cliente=${CLIENTE}
        );
        const data = await res.json();

        if (!data.ok) return;
        if (!data.actual) return;

        // Mostrar títulos
        tituloActual.textContent =
            "🎵 " + (data.actual.titulo || "Sin título");

        tituloSiguiente.textContent =
            data.siguiente
                ? "⏭️ Sigue: " + data.siguiente.titulo
                : "";

        // Si cambió el video, cargarlo
        if (videoActualId !== data.actual.videoId) {
            videoActualId = data.actual.videoId;
            video.src = data.actual.video_url;
            video.load();

            try {
                await video.play();
            } catch (e) {
                console.log("Autoplay bloqueado:", e);
            }
        }

        // Control DJ
        if (data.control) {
            if (data.control.action === "pause") {
                video.pause();
            }

            if (data.control.action === "play") {
                try { await video.play(); } catch (e) {}
            }

            if (data.control.action === "next") {
                await siguienteCancion();
            }
        }

    } catch (err) {
        console.error("Error:", err);
    }
}

// Avisar al backend que terminó el video
async function siguienteCancion() {
    try {
        await fetch(${BACKEND}/player/next, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                cliente: CLIENTE
            })
        });

        // Esperar y recargar
        setTimeout(cargarEstado, 2000);

    } catch (err) {
        console.error("Error avanzando:", err);
    }
}

// Cuando termina el video
video.addEventListener("ended", siguienteCancion);

// Consultar estado cada 5 segundos
setInterval(cargarEstado, 5000);

// Primera carga
cargarEstado();
</script>

</body>
</html>
