<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayBar Go - Reproductor</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#contenedor {
    display: flex;
    width: 100vw;
    height: 100vh;
    background: #000;
}

#video-container {
    flex: 1;
    position: relative;
    background: #000;
}

#video {
    width: 100%;
    height: 100%;
    background: #000;
}

#playlist {
    width: 380px;
    background: #111;
    color: #fff;
    overflow-y: auto;
    border-left: 1px solid rgba(255,255,255,0.1);
}

#playlist h2 {
    margin: 0;
    padding: 18px 20px;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    color: #ffffff;
    background: linear-gradient(135deg, #161616, #262626);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
}

.playlist-item {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

.playlist-item.actual {
    background: rgba(255, 0, 0, 0.12);
    border-left: 4px solid #ff0000;
}

.playlist-item .titulo {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.35;
}

.playlist-item .estado {
    margin-top: 6px;
    font-size: 12px;
    opacity: 0.7;
}

.acciones {
    margin-top: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.btn-accion {
    border: none;
    background: rgba(255,255,255,0.08);
    color: #fff;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.btn-accion:hover {
    background: rgba(255,255,255,0.18);
}

#estado {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 9999;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}

/* Vista móvil */
@media (max-width: 900px) {
    #contenedor {
        flex-direction: column;
    }

    #playlist {
        width: 100%;
        height: 35vh;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.1);
    }

    #video-container {
        height: 65vh;
    }
}

    .thumb {
    width: 120px;
    height: 68px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.info {
    flex: 1;
    min-width: 0;
}

.estado-item {
    margin-top: 6px;
    font-size: 12px;
    opacity: 0.7;
}

/* ==========================================
   LOGO EN ENCABEZADO DE PLAYLIST
========================================== */
.logo-header {
    width: 34px;
    height: 34px;
    object-fit: contain;
    vertical-align: middle;
    margin-right: 10px;
    border-radius: 8px;
}

/* ==========================================
   MARCA DE AGUA SOBRE EL VIDEO
========================================== */
#logo-watermark {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 90px;
    max-height: 90px;
    object-fit: contain;
    z-index: 9998;
    opacity: 0.88;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
    pointer-events: none;
}

/* ==========================================
   ENCABEZADO PROFESIONAL
========================================== */
#playlist h2 {
    margin: 0;
    padding: 16px 20px;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #ffffff;
    background: linear-gradient(135deg, #161616, #262626);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
}

/* ==========================================
   BOTONES MÁS PROFESIONALES
========================================== */
.playlist-item .acciones button {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(145deg, #1f1f1f, #2b2b2b);
    color: #ffffff;
    cursor: pointer;
    margin-right: 6px;
    font-size: 15px;
    box-shadow:
        0 4px 10px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.05);
    transition: all 0.2s ease;
}

.playlist-item .acciones button:hover {
    transform: translateY(-2px) scale(1.05);
    background: linear-gradient(145deg, #6f00ff, #9a3cff);
    box-shadow: 0 6px 14px rgba(111, 0, 255, 0.35);
}

.playlist-item .acciones button:active {
    transform: scale(0.95);
}

    .logo-header {
    width: 52px;
    height: 52px;
    object-fit: contain;
    margin-right: 14px;
    border-radius: 10px;
    flex-shrink: 0;
},
#logo-watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    max-width: 22vw;
    max-height: 220px;
    object-fit: contain;
    z-index: 9998;
    opacity: 0.18;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
    pointer-events: none;
}
</style>
</head>
<body>

<div id="contenedor">

    <div id="video-container">
    <img
            src="https://drive.google.com/thumbnail?id=1D8_YN-_Ro5ldLSzgK-QDClR6WHLRKjYr&sz=w1000"
            class="logo-header"
            alt="PlayBar Go">
        alt="PlayBar Go">

    <div id="estado">Cargando...</div>

        <video
            id="video"
            controls
            autoplay
            playsinline>
        </video>
    </div>

    <div id="playlist">
    <h2>
        <img
            src="https://drive.google.com/thumbnail?id=1D8_YN-_Ro5ldLSzgK-QDClR6WHLRKjYr&sz=w1000"
            class="logo-header"
            alt="PlayBar Go">
        PlayBar Go
    </h2>
    <div id="playlist-items"></div>
</div>

</div>

<script>
const API_URL = "https://playbargo-player-jukebox-repro-propio.up.railway.app";
const CLIENTE = "A33";

const video = document.getElementById("video");
const estado = document.getElementById("estado");
const playlistItems = document.getElementById("playlist-items");

let videoActual = "";

async function cargarEstado() {
    try {
        const response = await fetch(
            API_URL + "/player/status?cliente=" + CLIENTE
        );

        const data = await response.json();
        renderPlaylist(data);

        if (!data.ok) {
            estado.textContent = data.mensaje || "Esperando canciones...";
            return;
        }

        if (!data.actual || !data.actual.video_url) {
            estado.textContent = "No hay video disponible";
            return;
        }

        const actual = data.actual;
        const id = actual.videoId || "";

        if (id !== videoActual) {
            videoActual = id;

            estado.textContent =
                actual.titulo || "Reproduciendo...";

// Reiniciar completamente el reproductor
video.pause();
video.removeAttribute("src");
video.load();

// Crear una fuente explícita MP4
video.innerHTML = "";
const source = document.createElement("source");
source.src = actual.video_url;
source.type = "video/mp4";
video.appendChild(source);

// Configuración
video.controls = true;
video.volume = 1.0;
video.muted = false;
video.defaultMuted = false;

// Cargar y reproducir
video.load();

try {
    await video.play();
} catch (err) {
    console.log("Autoplay bloqueado. Haz un clic en la pantalla.");
    estado.textContent = "Haz clic en cualquier parte para activar el audio";
}
        }
    } catch (err) {
        console.error(err);
        estado.textContent = "Error de conexión";
    }
}

video.addEventListener("ended", async function () {
    estado.textContent = "Cargando siguiente canción...";
    videoActual = "";   // Fuerza a detectar un nuevo video

    try {
        // Notifica al backend que debe avanzar
        await fetch(
            API_URL + "/player/next?cliente=" + CLIENTE,
            {
                method: "POST"
            }
        );
    } catch (err) {
        console.error("Error avanzando:", err);
    }

    // Espera 3 segundos para que el backend procese
    setTimeout(async function () {
        await cargarEstado();
    }, 3000);
});

    let autoplayDesbloqueado = false;

async function desbloquearAutoplay() {
    if (autoplayDesbloqueado) return;

    autoplayDesbloqueado = true;

    try {
        video.muted = false;
        video.defaultMuted = false;
        video.volume = 1.0;
        await video.play();
        console.log("Autoplay y audio desbloqueados.");
    } catch (e) {
        console.log("No se pudo desbloquear:", e);
        autoplayDesbloqueado = false;
    }
}

document.addEventListener("click", desbloquearAutoplay, { once: true });
document.addEventListener("touchstart", desbloquearAutoplay, { once: true });
document.addEventListener("keydown", desbloquearAutoplay, { once: true });

function renderPlaylist(data) {
    if (!data || !data.actual) {
        playlistItems.innerHTML = "";
        return;
    }

    let html = "";

    // Canción actual
html += `
    <div class="playlist-item actual">
        <div class="miniatura">
            <img src="https://img.youtube.com/vi/${data.actual.videoId}/mqdefault.jpg">
        </div>
        <div class="info">
            <div class="titulo">▶️ ${data.actual.titulo || 'Reproduciendo...'}</div>
            <div class="estado">En reproducción</div>

            <div class="acciones">
    <button class="btn-accion" onclick="accionPlaylist('anterior', 0)">⏮️</button>
    <button class="btn-accion" onclick="accionPlaylist('siguiente', 0)">⏭️</button>
    <button class="btn-accion" onclick="accionPlaylist('eliminar', 0)">🗑️</button>
</div>
        </div>
    </div>
`;

    // Siguiente canción
    if (data.cola && data.cola.length > 0) {
    data.cola.forEach((item, index) => {
        html += `
    <div class="playlist-item">
        <div class="miniatura">
            <img src="https://img.youtube.com/vi/${item.videoId}/mqdefault.jpg">
        </div>
        <div class="info">
            <div class="titulo">${index + 1}. ${item.titulo}</div>
            <div class="estado">En cola</div>

            <div class="acciones">
                <button class="btn-accion"
                    onclick="accionPlaylist('subir', ${index + 1})">⬆️</button>

                <button class="btn-accion"
                    onclick="accionPlaylist('bajar', ${index + 1})">⬇️</button>
                <button class="btn-accion"
                    onclick="accionPlaylist('eliminar', ${index + 1})">🗑️</button>
            </div>
        </div>
    </div>
`;
    });
}

    playlistItems.innerHTML = html;
}

async function accionPlaylist(accion, posicion) {
    try {
        const response = await fetch(
            API_URL + "/player/action",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    cliente: CLIENTE,
                    accion: accion,
                    posicion: posicion
                })
            }
        );

        const data = await response.json();

        if (data.ok) {
            await cargarEstado();
        } else {
            alert(data.mensaje || "No se pudo ejecutar la acción");
        }
    } catch (err) {
        console.error(err);
        alert("Error ejecutando acción");
    }
}

setInterval(cargarEstado, 15000);
cargarEstado();
</script>

</body>
</html>
