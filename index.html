<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayBar Go - Reproductor</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#video {
    width: 100vw;
    height: 100vh;
    background: #000;
}

#info {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 15px 20px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    z-index: 999;
}
</style>
</head>
<body>

<div id="info">Cargando...</div>

<video
    id="video"
    controls
    autoplay
    muted
    playsinline>
</video>

<script>
const API_URL = "https://playbargo-player-jukebox-repro-propio.up.railway.app";
const CLIENTE = "A33";

const video = document.getElementById("video");
const info = document.getElementById("info");

let videoActual = "";

async function cargarEstado() {
    try {
        const respuesta = await fetch(
            ${API_URL}/player/status?cliente=${CLIENTE}
        );

        const data = await respuesta.json();

        if (!data.ok) {
            info.textContent = data.mensaje || "Esperando canciones...";
            return;
        }

        const actual = data.actual;

        if (!actual || !actual.video_url) {
            info.textContent = "No hay video disponible";
            return;
        }

        if (actual.videoId !== videoActual) {
            videoActual = actual.videoId;

            info.textContent = actual.titulo || "Reproduciendo...";

            video.src = actual.video_url;
            video.load();

            try {
                await video.play();
            } catch (e) {
                console.log("Autoplay bloqueado:", e);
            }
        }
    } catch (error) {
        console.error("Error:", error);
        info.textContent = "Error de conexión";
    }
}

video.addEventListener("ended", async () => {
    try {
        await fetch(
            ${API_URL}/player/next?cliente=${CLIENTE},
            { method: "POST" }
        );
    } catch (e) {
        console.error("Error avanzando:", e);
    }

    setTimeout(cargarEstado, 1000);
});

// Verificar cada 5 segundos
setInterval(cargarEstado, 5000);

// Primera carga
cargarEstado();
</script>

</body>
</html>
